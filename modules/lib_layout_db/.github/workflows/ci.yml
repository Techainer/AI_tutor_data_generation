name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  DOCKER_URL: docker.io
  DOCKER_HUB_NAMESPACE: techainer1t
  DOCKER_HUB_USERNAME: techainer1t
  DVC_REMOTE_ALIAS: techainer

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_triton:
    runs-on: self-hosted-cpu
    if: "contains(github.event.head_commit.message, 'build')"
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v3.x

      - name: Build and push Docker image for Triton
        env:
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          HARDWARE_TYPE: triton
        run: |
          IMAGE_NAME=$DOCKER_URL/$DOCKER_HUB_NAMESPACE/$GITHUB_REPOSITORY_NAME_PART:$HARDWARE_TYPE-$GITHUB_REF_SLUG-$GITHUB_SHA_SHORT
          DOCKER_BUILDKIT=1 docker build -f docker/$HARDWARE_TYPE.Dockerfile -t $IMAGE_NAME .
          echo "$DOCKER_HUB_PASSWORD" | docker login --username $DOCKER_HUB_USERNAME --password-stdin $DOCKER_URL
          docker push $IMAGE_NAME
          docker logout

  build_model_storage:
    runs-on: self-hosted-cpu
    if: "contains(github.event.head_commit.message, 'storage')"
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Pull model from DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull -r $DVC_REMOTE_ALIAS -R models

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v3.x

      - name: Build and push Docker image
        env:
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          HARDWARE_TYPE: model_storage
        run: |
          IMAGE_NAME=$DOCKER_URL/$DOCKER_HUB_NAMESPACE/$GITHUB_REPOSITORY_NAME_PART:$HARDWARE_TYPE-$GITHUB_REF_SLUG-$GITHUB_SHA_SHORT
          DOCKER_BUILDKIT=1 docker build -f docker/$HARDWARE_TYPE.Dockerfile -t $IMAGE_NAME .
          echo "$DOCKER_HUB_PASSWORD" | docker login --username $DOCKER_HUB_USERNAME --password-stdin $DOCKER_URL
          docker push $IMAGE_NAME
          docker logout