stages:
  - sanity_check
  - build
  - test

pylint:
  stage: sanity_check
  script:
    - mkdir ./pylint
    - pylint --output-format=text *.py 2>&1 | tee ./pylint/pylint.log || pylint-exit $?
    - PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' ./pylint/pylint.log)
    - anybadge --label=Pylint --file=pylint/pylint.svg --value=$PYLINT_SCORE 2=red 4=orange 8=yellow 10=green
    - echo "Pylint score is $PYLINT_SCORE"
  artifacts:
    paths:
      - ./pylint/

cpu_build:
  stage: build
  script:
      - dvc pull -r "$DVC_REMOTE_ALIAS"
      - docker login -u="$DOCKER_HUB_USERNAME" -p="$DOCKER_HUB_PASSWORD" "$DOCKER_URL"
      - export DOCKER_BUILDKIT=1
      - docker build -f cpu.Dockerfile -t $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:cpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA .
      - docker push $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:cpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA
      - docker logout

gpu_build:
  stage: build
  script:
      - dvc pull -r "$DVC_REMOTE_ALIAS"
      - docker login -u="$DOCKER_HUB_USERNAME" -p="$DOCKER_HUB_PASSWORD" "$DOCKER_URL"
      - export DOCKER_BUILDKIT=1
      - docker build -f gpu.Dockerfile -t $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:gpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA .
      - docker push $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:gpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA
      - docker logout

cpu_test:
    stage: test
    needs: ["cpu_build"]
    script:
      - docker login -u="$DOCKER_HUB_USERNAME" -p="$DOCKER_HUB_PASSWORD" "$DOCKER_URL"
      - docker pull $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:cpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA
      - docker logout
      - read -r -a arr <<< $(docker images | grep cpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA)
      - ./tests/test_docker.sh ${arr[2]}
      - docker run -v $PWD/results:/code/results $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:cpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA /bin/bash -c "/code/tests/test.sh $(id -u) $(id -g)"

gpu_test:
    stage: test
    needs: ["gpu_build"]
    tags:
      - gpu
    script:
      - docker login -u="$DOCKER_HUB_USERNAME" -p="$DOCKER_HUB_PASSWORD" "$DOCKER_URL"
      - docker pull $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:gpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA
      - docker logout
      - read -r -a arr <<< $(docker images | grep gpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA)
      - ./tests/test_docker.sh ${arr[2]} 1
      - docker run --gpus all -v $PWD/results:/code/results $DOCKER_URL/$DOCKER_HUB_NAMESPACE/$CI_PROJECT_NAME:gpu-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA /bin/bash -c "/code/tests/test.sh $(id -u) $(id -g)"
